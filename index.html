<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="animated-bg"></div>

<!-- LOGIN PAGE -->
<div class="login-container" id="login-container">
  <h2>Login</h2>
  <input id="login-name" type="text" placeholder="Enter your name">
  <button id="login-btn">Continue</button>
</div>

<!-- MAIN APP -->
<div class="container" id="app">
  <h1>Expense Tracker</h1>
  <p class="welcome-text">Welcome, <span id="username"></span> 👋</p>

  <!-- BALANCE -->
  <div class="balance-box">
    <h2>Your Balance</h2>
    <h3 id="balance">₹0.00</h3>
  </div>

  <!-- SUMMARY -->
  <div class="summary">
    <div class="box income">
      <h4>Income</h4>
      <p id="income">₹0.00</p>
    </div>

    <div class="box expense">
      <h4>Expense</h4>
      <p id="expense">₹0.00</p>
    </div>
  </div>

  <!-- FILTER -->
  <div class="filter">
    <label>Filter by Month:</label>
    <input type="month" id="filter-month">
  </div>

  <!-- PIE CHART -->
  <div class="chart-container">
    <canvas id="pieChart"></canvas>
  </div>

  <!-- ADD FORM -->
  <div class="form">
    <h3>Add Transaction</h3>

    <label>Description</label>
    <input type="text" id="text">

    <label>Category</label>
    <select id="category">
      <option value="Food">Food</option>
      <option value="Travel">Travel</option>
      <option value="Bills">Bills</option>
      <option value="Shopping">Shopping</option>
      <option value="Other">Other</option>
    </select>

    <label>Amount (+income / -expense)</label>
    <input type="number" id="amount">

    <button id="add-btn">Add Transaction</button>
  </div>

  <!-- HISTORY -->
  <h3 style="margin-top:20px;">History</h3>
  <ul id="list" class="list"></ul>

  <!-- PDF -->
  <button id="pdf-btn" class="pdf-btn">Download PDF Report</button>
</div>

<script src="script.js"></script>
</body>
</html>
